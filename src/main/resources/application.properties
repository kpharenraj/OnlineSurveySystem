spring.application.name=online-survey-system
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# The file-backed H2 database makes local setup zero-configuration. Set the
# Supabase environment variables to switch to PostgreSQL.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/surveydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT12H
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8080}
app.admin.email=${ADMIN_EMAIL:}
app.admin.bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
app.password-reset.otp-expiration=PT10M
app.password-reset.resend-cooldown=PT1M
app.password-reset.max-attempts=5
